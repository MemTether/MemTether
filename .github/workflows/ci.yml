name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check . --select E9,F63,F7,F82 --ignore E501

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server]"
          pip install pytest

      - name: Run pytest tests
        run: pytest tests/ -v --tb=short

      - name: Test PII roundtrip
        run: python scripts/test_pii_roundtrip.py


  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t memtether:ci .

      - name: Boot container and probe /health + /dashboard
        run: |
          docker run -d --name mt --rm -p 8820:8080 \
            -e MEMTETHER_API_KEY=ci-test-key \
            memtether:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8820/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8820/health
          BODY=$(curl -sf http://127.0.0.1:8820/dashboard)
          echo "$BODY" | grep -q 'Dashboard not found' && (echo 'dashboard missing'; exit 1) || echo 'dashboard OK'
          docker stop mt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Check packaging
        run: |
          pip install twine
          twine check dist/*
