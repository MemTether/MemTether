<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="360" fill="url(#bg)"/>

  <!-- Decorative circuit lines -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1400" y2="60"/>
    <line x1="0" y1="120" x2="1400" y2="120"/>
    <line x1="0" y1="240" x2="1400" y2="240"/>
    <line x1="0" y1="300" x2="1400" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Decorative nodes (circuit board style) -->
  <g opacity="0.1">
    <circle cx="200" cy="60" r="4" fill="#38bdf8"/>
    <circle cx="600" cy="120" r="4" fill="#22c55e"/>
    <circle cx="1000" cy="60" r="4" fill="#e94560"/>
    <circle cx="200" cy="300" r="4" fill="#e94560"/>
    <circle cx="600" cy="240" r="4" fill="#38bdf8"/>
    <circle cx="1000" cy="300" r="4" fill="#22c55e"/>
  </g>

  <!-- Main title -->
  <text x="700" y="155" text-anchor="middle" fill="#e2e8f0" font-size="64" font-weight="800" letter-spacing="8">MemTether</text>

  <!-- Gradient underline -->
  <rect x="500" y="172" width="400" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Tagline -->
  <text x="700" y="210" text-anchor="middle" fill="#94a3b8" font-size="20" font-weight="400">
    Cross-Client AI Memory Hub
  </text>
  <text x="700" y="238" text-anchor="middle" fill="#64748b" font-size="14">
    多个 AI 客户端共享同一份物理记忆 · 文件级指针 · 零云服务 · 零费用
  </text>

  <!-- Feature pills -->
  <g font-size="13">
    <rect x="380" y="270" width="150" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="455" y="292" text-anchor="middle" fill="#38bdf8">supersession</text>

    <rect x="550" y="270" width="150" height="34" rx="17" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="625" y="292" text-anchor="middle" fill="#22c55e">dual-timeline</text>

    <rect x="720" y="270" width="130" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="785" y="292" text-anchor="middle" fill="#f59e0b">zero cost</text>

    <rect x="870" y="270" width="150" height="34" rx="17" fill="#1e293b" stroke="#e94560" stroke-width="1"/>
    <text x="945" y="292" text-anchor="middle" fill="#e94560">23 adapters</text>
  </g>

  <!-- Bottom gradient line -->
  <rect x="0" y="352" width="1400" height="8" fill="url(#accent)" opacity="0.3"/>
</svg>