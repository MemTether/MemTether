<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="url(#bg)" rx="16"/>

  <!-- ===== CLIENTS ROW ===== -->
  <text x="700" y="42" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">AI CLIENTS</text>

  <rect x="90" y="55" width="220" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="80" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">Codex CLI</text>
  <text x="200" y="98" text-anchor="middle" fill="#64748b" font-size="12">AI Coding Agent</text>

  <rect x="360" y="55" width="220" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="470" y="80" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">WorkBuddy</text>
  <text x="470" y="98" text-anchor="middle" fill="#64748b" font-size="12">Domestic + Intl</text>

  <rect x="630" y="55" width="220" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="740" y="80" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">OpenClaw</text>
  <text x="740" y="98" text-anchor="middle" fill="#64748b" font-size="12">grok-4.6</text>

  <rect x="900" y="55" width="220" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1010" y="80" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">ZCode / Tabbit</text>
  <text x="1010" y="98" text-anchor="middle" fill="#64748b" font-size="12">More clients</text>

  <!-- Pointer annotation -->
  <text x="640" y="135" text-anchor="middle" fill="#475569" font-size="12" font-style="italic">
    file-level pointers (junction / symlink → same physical file)
  </text>

  <!-- Arrows from clients to core -->
  <line x1="200" y1="107" x2="200" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="107" x2="470" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="107" x2="740" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1010" y1="107" x2="1010" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== CORE PIPELINE ===== -->
  <rect x="40" y="175" width="1320" height="140" rx="14" fill="#0c1e3a" stroke="#334155" stroke-width="1"/>
  <text x="700" y="198" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700" letter-spacing="2">MEMTETHER CORE</text>

  <!-- gateway -->
  <rect x="70" y="215" width="280" height="80" rx="10" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="210" y="243" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">gateway.py</text>
  <text x="210" y="262" text-anchor="middle" fill="#7dd3fc" font-size="12">Write Pipeline</text>
  <text x="210" y="280" text-anchor="middle" fill="#64748b" font-size="11">source · PII gate · dedup</text>

  <!-- memsearch -->
  <rect x="400" y="215" width="280" height="80" rx="10" fill="#1e3a5f" stroke="#22c55e" stroke-width="1.5"/>
  <text x="540" y="243" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">memsearch.py</text>
  <text x="540" y="262" text-anchor="middle" fill="#86efac" font-size="12">Retrieval Pipeline</text>
  <text x="540" y="280" text-anchor="middle" fill="#64748b" font-size="11">4-way · RRF · rerank</text>

  <!-- governance -->
  <rect x="730" y="215" width="280" height="80" rx="10" fill="#1e3a5f" stroke="#e94560" stroke-width="1.5"/>
  <text x="870" y="243" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">governance.py</text>
  <text x="870" y="262" text-anchor="middle" fill="#fca5a5" font-size="12">Governance Pipeline</text>
  <text x="870" y="280" text-anchor="middle" fill="#64748b" font-size="11">conflict · dual-timeline · supersede</text>

  <!-- rebuild -->
  <rect x="1060" y="215" width="280" height="80" rx="10" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1200" y="243" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">rebuild</text>
  <text x="1200" y="262" text-anchor="middle" fill="#fbbf24" font-size="12">Projection Pipeline</text>
  <text x="1200" y="280" text-anchor="middle" fill="#64748b" font-size="11">3980 char budget · pinned first</text>

  <!-- Core arrows -->
  <line x1="350" y1="255" x2="398" y2="255" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="680" y1="255" x2="728" y2="255" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="1010" y1="255" x2="1058" y2="255" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows from core to storage -->
  <line x1="210" y1="295" x2="310" y2="370" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="540" y1="295" x2="610" y2="370" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ===== STORAGE ===== -->
  <rect x="220" y="375" width="900" height="120" rx="14" fill="#0c1e3a" stroke="#334155" stroke-width="1"/>
  <text x="670" y="398" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="1">STORAGE</text>

  <!-- memory.db -->
  <rect x="260" y="410" width="380" height="70" rx="10" fill="#1a1a3e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="450" y="437" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">memory.db</text>
  <text x="450" y="456" text-anchor="middle" fill="#86efac" font-size="12">SQLite WAL · single source of truth</text>
  <text x="450" y="472" text-anchor="middle" fill="#64748b" font-size="11">1101 active · 374 superseded · 67 tool assets</text>

  <!-- ChromaDB -->
  <rect x="690" y="410" width="380" height="70" rx="10" fill="#1a1a3e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="880" y="437" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">ChromaDB</text>
  <text x="880" y="456" text-anchor="middle" fill="#7dd3fc" font-size="12">bge-m3 · 1024-dim vectors</text>
  <text x="880" y="472" text-anchor="middle" fill="#64748b" font-size="11">HNSW index · offline capable</text>

  <!-- ===== EXCHANGE ===== -->
  <!-- Arrow from memory.db to exchange -->
  <line x1="450" y1="480" x2="450" y2="540" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="545" width="800" height="110" rx="14" fill="#0c1e3a" stroke="#e94560" stroke-width="1"/>
  <text x="700" y="568" text-anchor="middle" fill="#e94560" font-size="14" font-weight="700" letter-spacing="1">MEMORY EXCHANGE</text>

  <!-- Exchange Schema box -->
  <rect x="340" y="580" width="720" height="60" rx="10" fill="#2d1b4e" stroke="#e94560" stroke-width="1.5"/>
  <text x="700" y="605" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Exchange Schema v2</text>
  <text x="700" y="628" text-anchor="middle" fill="#c4b5fd" font-size="12">Mem0 · Zep · Letta · Graphiti · LangMem · COGX</text>

  <!-- consent / sync labels -->
  <text x="700" y="650" text-anchor="middle" fill="#64748b" font-size="11">consent · sync watermark · BLAKE3 · supersession chains</text>

  <!-- ===== FEATURE CARDS ===== -->
  <text x="700" y="705" text-anchor="middle" fill="#334155" font-size="20">─────</text>

  <!-- Card 1 -->
  <rect x="80" y="715" width="290" height="70" rx="12" fill="#1e293b" stroke="#e94560" stroke-width="1.5"/>
  <text x="225" y="742" text-anchor="middle" fill="#e94560" font-size="15" font-weight="700">Governance Model</text>
  <text x="225" y="762" text-anchor="middle" fill="#94a3b8" font-size="12">supersession · dual-timeline · Q-Value</text>
  <text x="225" y="778" text-anchor="middle" fill="#64748b" font-size="12">conflict detection</text>

  <!-- Card 2 -->
  <rect x="400" y="715" width="290" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="545" y="742" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">Cross-Client</text>
  <text x="545" y="762" text-anchor="middle" fill="#94a3b8" font-size="12">file-level pointers · 23 adapters</text>
  <text x="545" y="778" text-anchor="middle" fill="#64748b" font-size="12">one command setup</text>

  <!-- Card 3 -->
  <rect x="720" y="715" width="290" height="70" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="865" y="742" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="700">Zero Cost</text>
  <text x="865" y="762" text-anchor="middle" fill="#94a3b8" font-size="12">100% local · no API calls</text>
  <text x="865" y="778" text-anchor="middle" fill="#64748b" font-size="12">no cloud dependency</text>

  <!-- Card 4 -->
  <rect x="1040" y="715" width="290" height="70" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1185" y="742" text-anchor="middle" fill="#f59e0b" font-size="15" font-weight="700">Verifiable</text>
  <text x="1185" y="762" text-anchor="middle" fill="#94a3b8" font-size="12">benchmarks open-sourced</text>
  <text x="1185" y="778" text-anchor="middle" fill="#64748b" font-size="12">dual-scoring · reproducible</text>
</svg>