<svg xmlns="http://www.w3.org/2000/svg" width="2576" height="640" viewBox="0 0 1288 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="45%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1288" height="320" fill="url(#bg)"/>

  <!-- subtle grid pattern for depth -->
  <g opacity="0.03" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="80" x2="1288" y2="80"/>
    <line x1="0" y1="160" x2="1288" y2="160"/>
    <line x1="0" y1="240" x2="1288" y2="240"/>
    <line x1="322" y1="0" x2="322" y2="320"/>
    <line x1="644" y1="0" x2="644" y2="320"/>
    <line x1="966" y1="0" x2="966" y2="320"/>
  </g>

  <!-- top glow -->
  <rect x="0" y="0" width="1288" height="80" fill="url(#glow)"/>

  <!-- icon: hash chain link (three connected boxes with link lines) -->
  <g transform="translate(644, 75) scale(1.2)">
    <!-- box 1 -->
    <rect x="-72" y="-8" width="48" height="32" rx="6" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
    <rect x="-64" y="0" width="32" height="16" rx="3" fill="#38bdf8" opacity="0.15"/>
    <!-- chain link -->
    <line x1="-24" y1="8" x2="-12" y2="8" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="3,2"/>
    <!-- box 2 -->
    <rect x="-12" y="-8" width="48" height="32" rx="6" fill="none" stroke="#818cf8" stroke-width="2.5" opacity="0.9"/>
    <rect x="-4" y="0" width="32" height="16" rx="3" fill="#818cf8" opacity="0.15"/>
    <!-- chain link -->
    <line x1="36" y1="8" x2="48" y2="8" stroke="#e94560" stroke-width="2.5" stroke-dasharray="3,2"/>
    <!-- box 3 -->
    <rect x="48" y="-8" width="48" height="32" rx="6" fill="none" stroke="#e94560" stroke-width="2.5" opacity="0.9"/>
    <rect x="56" y="0" width="32" height="16" rx="3" fill="#e94560" opacity="0.15"/>
  </g>

  <!-- Project name -->
  <text x="644" y="165" text-anchor="middle" fill="#f0f6fc" font-size="48" font-weight="800" letter-spacing="4"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif">MemTether</text>

  <!-- Gradient underline -->
  <rect x="494" y="178" width="300" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Tagline -->
  <text x="644" y="212" text-anchor="middle" fill="#8b949e" font-size="18" font-weight="400"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif">Your agent remembers things. Who audits what it remembers?</text>

  <!-- Bottom accent line -->
  <rect x="0" y="314" width="1288" height="6" fill="url(#accent)" opacity="0.4"/>
</svg>