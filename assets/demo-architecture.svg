  <rect x="510" y="20" width="140" height="56" fill="#1f2335" rx="12" stroke="#e0af68" stroke-width="2"/>
  <text x="580" y="54" text-anchor="middle" fill="#e0af68" font-size="17">VS Code</text>

  <rect x="670" y="20" width="155" height="56" fill="#1f2335" rx="12" stroke="#f7768e" stroke-width="2"/>
  <text x="747" y="54" text-anchor="middle" fill="#f7768e" font-size="17">+ 19 more</text>

  <!-- Connector lines - all touch the hub box -->
  <line x1="92" y1="76" x2="92" y2="130" stroke="#3b4261" stroke-width="2"/>
  <line x1="260" y1="76" x2="260" y2="130" stroke="#3b4261" stroke-width="2"/>
  <line x1="420" y1="76" x2="420" y2="130" stroke="#3b4261" stroke-width="2"/>
  <line x1="580" y1="76" x2="580" y2="130" stroke="#3b4261" stroke-width="2"/>
  <line x1="747" y1="76" x2="747" y2="130" stroke="#3b4261" stroke-width="2"/>

  <!-- Hub box - FULL WIDTH -->
  <rect x="15" y="130" width="810" height="80" fill="url(#accent2)" rx="14" opacity="0.12"/>
  <rect x="15" y="130" width="810" height="80" fill="none" rx="14" stroke="url(#accent2)" stroke-width="2.5"/>
  <text x="420" y="163" text-anchor="middle" fill="#c0caf5" font-size="19" font-weight="bold">📦 MemTether Memory Hub</text>
