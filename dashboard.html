<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemTether Dashboard</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --accent: #58a6ff; --green: #3fb950; --border: #30363d; --card: #161b22; --muted: #8b949e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; padding: 24px; font-size: 16px; }
  h1 { font-size: 1.8em; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 16px; font-size: 1em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .card h2 { font-size: 1.1em; color: var(--accent); margin-bottom: 14px; }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 1em; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .val { color: var(--green); font-weight: bold; }
  input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 12px; border-radius: 8px; font-family: inherit; font-size: 1em; margin-bottom: 10px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }
  button { background: var(--accent); color: #fff; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 1em; font-weight: 600; }
  button:hover { background: #79c0ff; }
  .result { margin-top: 12px; padding: 12px; background: var(--bg); border-radius: 8px; font-size: 0.95em; max-height: 350px; overflow-y: auto; }
  .result-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .result-item:last-child { border-bottom: none; }
  .result-item .src { color: var(--muted); font-size: 0.85em; }
  .result-item .content { margin-top: 4px; }
  .status { font-size: 0.95em; color: var(--muted); margin-top: 8px; }
  .ok { color: var(--green); } .err { color: #f85149; }
  .api-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .api-bar input { width: 350px; margin-bottom: 0; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.85em; font-weight: bold; }
  .badge-ok { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-err { background: rgba(248,81,73,0.15); color: #f85149; }
</style>
</head>
<body>
<h1>⚙️ MemTether 控制台</h1>
<p class="subtitle">跨客户端 AI 记忆中枢 — 文件级指针，一个 SQLite，零云端</p>
<div class="api-bar">
  <span>API：</span>
  <input id="api-url" value="http://127.0.0.1:8820" />
  <button onclick="checkHealth()">连接</button>
  <span id="health-status"></span>
</div>
<hr style="border-color:var(--border);margin:16px 0">
<div class="grid">
  <div class="card">
    <h2>📊 统计</h2>
    <div id="stats-content" class="status">点「连接」加载</div>
  </div>
  <div class="card">
    <h2>🔍 搜索记忆</h2>
    <input id="search-query" placeholder="输入搜索关键词..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
    <div id="search-results" class="result"></div>
  </div>
  <div class="card">
    <h2>✏️ 写入记忆</h2>
    <textarea id="remember-content" rows="3" placeholder="记忆内容（第一句 = 结论）..."></textarea>
    <input id="remember-source" placeholder="来源（如 my-app）" value="dashboard">
    <button onclick="doRemember()">写入</button>
    <div id="remember-status" class="status"></div>
  </div>
  <div class="card">
    <h2>📝 最近记忆</h2>
    <button onclick="doList()">加载最近</button>
    <div id="list-results" class="result"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const api = () => api-url.value.replace(/\/$/, '');
async function checkHealth() {
  try {
    const r = await fetch(api() + '/health');
    const d = await r.json();
    health-status.innerHTML = d.ok ? '<span class="badge badge-ok">✅ 已连接</span>' : '<span class="badge badge-err">❌ 错误</span>';
    loadStats();
  } catch(e) {
    health-status.innerHTML = '<span class="badge badge-err">❌ 无法连接</span>';
  }
}
async function loadStats() {
  try {
    const r = await fetch(api() + '/stats');
    const d = await r.json();
    let html = '';
    const labels = {facts:'记忆条数', tool_assets:'工具资产', recipes:'任务配方', supersessions:'替代链', audit_log:'审计日志', candidates:'候选'};
    for (const [k, v] of Object.entries(d)) {
      const label = labels[k] || k;
      const val = typeof v === 'object' ? JSON.stringify(v) : v;
      html += '<div class="stat-row"><span>' + label + '</span><span class="val">' + val + '</span></div>';
    }
    stats-content.innerHTML = html;
  } catch(e) { stats-content.innerHTML = '<span class="err">' + e.message + '</span>'; }
}
async function doSearch() {
  const q = search-query.value;
  if (!q) return;
  try {
    const r = await fetch(api() + '/search', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query: q}) });
    const d = await r.json();
    const results = d.results || [];
    let html = results.length ? '' : '<span class="status">没有找到相关记忆</span>';
    for (const item of results) {
      const src = item.source || '?';
      const content = (item.content || '').substring(0, 300);
      html += '<div class="result-item"><div class="src">来源: ' + src + '</div><div class="content">' + content + '</div></div>';
    }
    search-results.innerHTML = html;
  } catch(e) { search-results.innerHTML = '<span class="err">' + e.message + '</span>'; }
}
async function doRemember() {
  const content = remember-content.value;
  const source = remember-source.value;
  if (!content) return;
  try {
    const r = await fetch(api() + '/remember', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({content, source}) });
    const d = await r.json();
    remember-status.innerHTML = d.ok ? '<span class="ok">✅ 已写入</span>' : '<span class="err">❌ 失败</span>';
    remember-content.value = '';
  } catch(e) { remember-status.innerHTML = '<span class="err">' + e.message + '</span>'; }
}
async function doList() {
  try {
    const r = await fetch(api() + '/list?limit=20');
    const d = await r.json();
    const results = d.results || d.memories || d || [];
    let html = '';
    if (Array.isArray(results)) {
      for (const item of results) {
        if (typeof item === 'object' && item.content) {
          html += '<div class="result-item"><div class="src">[' + (item.source || '?') + '] ' + (item.type || '') + '</div><div class="content">' + item.content.substring(0, 200) + '</div></div>';
        }
      }
    }
    list-results.innerHTML = html || '<span class="status">空</span>';
  } catch(e) { list-results.innerHTML = '<span class="err">' + e.message + '</span>'; }
}
window.onload = checkHealth;
</script>
</body>
</html>
