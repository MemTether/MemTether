# MemTether —— 打包配置（★唯一构建配置，就这一处）
#
# 为什么在仓库根，而不是 `packaging/`
# ----------------------------------
# 2026-09-16 实测缺陷：`packaging/pyproject.toml` 声称 `name = "memtether"`、
# `packages = ["memtether"]`，但 `packaging/src/memtether/__init__.py` 是个只有
# `__version__` 的空壳，真实模块（gateway.py / mem.py / memsearch.py …）全在仓库根。
# 后果：`python -m build` 通过 → `pip install` 通过 → `import memtether` 通过 →
# **然后什么也干不了** —— 典型的「跑起来不报错、但结果全错」。
#
# 修法：把构建配置搬到仓库根，让「仓库里有什么」= 「wheel 里有什么」。
# 原来那份 `packaging/` 已整目录删除（git 历史可追），
# 避免出现第二份会与真源漂移的构建配置。
#
# 结构说明
# --------
# 引擎模块是**平铺**在仓库根的（`import gateway` 这类顶层互相引用），
# 且生产环境（memory_hub 按脚本路径直接调用）依赖这个结构，不能改。
# 所以这里用 `py-modules` 逐个列出，而不是 `packages`。
# `scripts/` 是唯一的包（演示库生成器在里面）。
# 门面与 CLI 入口在 `memtether.py`（`[project.scripts]` 指向它）。
#
# ★新增根模块后必须把名字补进 py-modules，否则 wheel 里没有它 ——
#   而 `pip install` 不会报任何错，只会在运行到那条路径时才炸。
#   校验：`python scripts/check_packaging.py`（缺失/多余都会报出来）

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memtether"
version = "0.1.0a35"
description = "Cross-client memory hub for AI agents — one physical memory, many clients"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "MemTether Contributors"}]
keywords = ["memory", "agent", "ai", "llm", "mcp", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # ★只留一个硬依赖。理由（2026-09-16 逐个模块核过顶层 import）：
    #   · 核心引擎（gateway / mem / memsearch / governance / embed_local / project /
    #     refuse_live / refuse_gate / tool_audit …）**顶层全是标准库**，装完即用；
    #   · `numpy` 只有 cross-encoder 精排（rerank.py）与 pair_superseded.py 用。
    #     缺它时 memsearch 会 try/except 兜住并退回 RRF（打印 [warn]），**不崩**，
    #     但排序质量确实下降 —— 所以它是"要完整体验就必须有"的那一个；
    #   · chromadb / onnxruntime / tokenizers 只服务**语义路**，缺了会降级成
    #     关键词 + 字面检索（演示库本来就没有预建向量索引）→ 放 extra，
    #     不让只想跑 demo 的人先下 300MB。
    "numpy",
]

[project.optional-dependencies]
# 语义检索：本地 bge-m3 int8 embedding（onnxruntime + tokenizers）+ 本地向量库。
# 装完还要建一次索引：`python -m memsearch --rebuild`
vector = ["chromadb", "onnxruntime", "tokenizers"]
# Schema v2 P0: per-fact content hash（BLAKE3）；不装则回退 sha256
blake3 = ["blake3"]
server = ["fastapi", "uvicorn", "httpx",
    "slowapi>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/MemTether/MemTether"
Repository = "https://github.com/MemTether/MemTether"
Issues = "https://github.com/MemTether/MemTether/issues"
Security = "https://github.com/MemTether/MemTether/blob/main/SECURITY.md"

[project.scripts]
# 门面在 memtether.py（仓库根），它负责把平铺的引擎模块接到 sys.path 上。
memtether = "memtether:main"
# 客户端接入器（装完直接 `memtether-connect detect` 就能看本机有哪些客户端）
memtether-connect = "tether_connect:main"

[tool.setuptools]
# ★不写 packages = ["memtether"]：那会指向一个不存在的包（空壳已删）。
# clients = 客户端适配器包（tether_connect 用），必须在这里登记，
#   否则 `pip install` 出来的包**不带** clients/，工具一跑就 ImportError。
packages = ["scripts", "clients", "integrations"]
include-package-data = false
package-data = {"*" = ["dashboard.html", "start_dashboard.bat"]}
py-modules = [
    "api_server",
    "consolidation",
    "embed_local",
    "extract",
    "gateway",
    "governance",
    "hubguard",
    "mcp_server",
    "mem0_exchange",
    "memsearch",
    "memtether",
    "memtether_exchange",
    "memtether_paths",
    "predicates",
    "rerank",
    "tether_connect",
    "tool_audit",
    "memtether_pipeline",
    "zep_exchange",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    'slow: marks tests as slow',
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
